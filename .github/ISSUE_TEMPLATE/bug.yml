name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of the About page or package.json version.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / diagnostics
      description: Settings → Advanced → Export diagnostics (paths are redacted).
