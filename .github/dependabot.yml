version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - electron
          - electron-*
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      tooling:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
          - '@vitest/*'
          - '@biomejs/*'
          - typescript
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
